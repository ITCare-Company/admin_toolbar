admin_toolbar.settings:
  type: config_object
  label: 'Admin Toolbar settings'
  mapping:
    menu_depth:
      type: integer
      label: 'Depth of displayed menu'
    enable_hoverintent:
      type: boolean
      label: 'Enable HoverIntent'
    sticky_behavior:
      type: string
      label: 'Sticky toolbar behavior'
      options:
        enabled: 'Enabled'
        disabled: 'Disabled'
        hide_on_scroll_down: 'Disabled: Hide on scroll-down, show on scroll-up'
